# Profil de test — utilisé exclusivement par les tests automatisés (unitaires).
#
# Les valeurs de datasource sont volontairement désactivées : les tests unitaires
# utilisent des mocks (Mockito) et ne se connectent pas à une base de données réelle.
# Flyway est également désactivé pour la même raison.
#
# Toutes les variables sans valeur par défaut dans application.yml reçoivent ici
# des valeurs factices suffisantes pour que le contexte Spring démarre si nécessaire.

spring:
  config:
    # Ne pas tenter d'importer le fichier .env en contexte de test
    import: ""

  datasource:
    url: "jdbc:postgresql://unused:5432/unused"
    username: "unused"
    password: "unused"

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    # Désactivé en tests unitaires — pas de base de données réelle disponible
    enabled: false

  ai:
    openai:
      base-url: https://integrate.api.nvidia.com
      api-key: nvapi-test-dummy-key
      chat:
        options:
          model: openai/gpt-oss-20b

# JWT — clé factice de 64 caractères base64 (longueur suffisante pour HS512)
jwt:
  secret: dGVzdC1zZWNyZXQtY2xleS10ZXN0LXNlY3JldC1jbGV5LXRlc3Qtc2VjcmV0LWNsZXktdGVzdA==
  expiration: 86400000

# SendGrid — clé factice (aucun email réel envoyé en test)
sendgrid:
  api-key: SG.test-dummy-api-key-for-tests-only
  sender-email: test@test.invalid
  sender-name: Test Suite

# Worker email — cron qui ne se déclenchera jamais en test
email:
  worker:
    batch-size: 20
    max-tentatives: 5
    cron: "0 0 3 1 1 ?"

# MinIO — endpoint factice (aucun upload réel en test)
minio:
  endpoint: http://localhost:9999
  access-key: test-access-key
  secret-key: test-secret-key
  bucket: test-rapports

# VAPID — clés factices (aucune notification push réelle en test)
vapid:
  public-key: BH-nHknLiq_JHW-JEIaWPdcz_DuISrT6bTW6cP3fzjyNYaG1yLSuvgzbHYk-XvShYtAam-9X1N7G3nXTV_4zzr4
  private-key: o89JFPpDymxO1R-10GVTo79OCV6QCV_s2ga3UvGn45I
  subject: mailto:test@test.invalid

app:
  frontend-url: http://localhost:5173
  auth:
    reset-token-expiration-minutes: 15
    activation-token-expiration-hours: 24
  security:
    secure-cookie: false
  cors:
    allowed-origins: http://localhost:5173
  admin:
    initial-email: admin@test.invalid
    initial-password: TestPassword123!

python-service:
  url: http://localhost:8000
