server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized

spring:
  config:
    import: optional:file:java-service/.env[.properties]
  application:
    name: supervision-service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

python-service:
  url: ${PYTHON_SERVICE_URL:http://localhost:8000}

sendgrid:
  api-key: ${SENDGRID_API_KEY}
  sender-email: ${SENDGRID_SENDER_EMAIL}
  sender-name: ${SENDGRID_SENDER_NAME:Supervision Cabine de Peinture}

email:
  worker:
    batch-size: ${EMAIL_WORKER_BATCH_SIZE:20}
    max-tentatives: ${EMAIL_WORKER_MAX_TENTATIVES:5}
    cron: ${EMAIL_WORKER_CRON:*/5 * * * * *}


jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  auth:
    reset-token-expiration-minutes: ${RESET_TOKEN_EXPIRATION_MINUTES:15}
    activation-token-expiration-hours: ${ACTIVATION_TOKEN_EXPIRATION_HOURS:24}
  security:
    secure-cookie: ${SECURE_COOKIE:false}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  admin:
    initial-email: ${ADMIN_INITIAL_EMAIL:admin@renault.com}
    initial-password: ${ADMIN_INITIAL_PASSWORD:ChangeMe123!}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  bucket: ${MINIO_BUCKET:rapports}

vapid:
  public-key: ${VAPID_PUBLIC_KEY}
  private-key: ${VAPID_PRIVATE_KEY}
  subject: ${VAPID_SUBJECT:mailto:contact@votre-domaine.com}
