name: Java Service - Tests

on:
  push:
    paths:
      - 'java-service/**'
  pull_request:
    paths:
      - 'java-service/**'

jobs:
  test:
    runs-on: ubuntu-latest
    # Docker est disponible nativement sur ubuntu-latest.
    # Testcontainers démarre lui-même le conteneur PostgreSQL — aucune configuration
    # de service Docker manuelle n'est nécessaire dans ce workflow.

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup JDK 21 Temurin
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Exécuter les tests (unitaires + intégration)
        # mvn verify exécute successivement :
        #   - maven-surefire-plugin  → *Test.java  (tests unitaires, phase test)
        #   - maven-failsafe-plugin  → *IT.java    (tests d'intégration Testcontainers, phase integration-test + verify)
        run: mvn verify -f java-service/pom.xml

      - name: Upload des rapports de test en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: |
            java-service/target/surefire-reports
            java-service/target/failsafe-reports
